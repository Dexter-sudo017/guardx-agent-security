<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuardX Access</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #18212f;
      --muted: #5f6d7e;
      --line: #d9e0e8;
      --accent: #155e75;
      --accent-soft: #e8f3f6;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(440px, calc(100vw - 28px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      display: grid;
      gap: 12px;
    }
    .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    p { margin: 4px 0 0; color: var(--muted); }
    label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
    }
    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    .langbar { display: flex; gap: 6px; }
    .langbar button {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
      padding: 7px 9px;
    }
    .langbar button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .status { min-height: 20px; color: var(--muted); }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>GuardX</h1>
        <p data-i18n="subtitle">受保护的实验入口</p>
      </div>
      <div class="langbar">
        <button class="lang" data-lang="zh">中文</button>
        <button class="lang" data-lang="en">EN</button>
      </div>
    </div>
    <div>
      <label for="token" data-i18n="tokenLabel">访问密钥</label>
      <input id="token" type="password" autocomplete="current-password" autofocus>
    </div>
    <button id="login" data-i18n="login">进入工作区</button>
    <div id="status" class="status"></div>
  </main>
  <script>
    const dict = {
      zh: { subtitle: "受保护的实验入口", tokenLabel: "访问密钥", login: "进入工作区", checking: "正在校验", invalid: "访问密钥无效。" },
      en: { subtitle: "Protected experiment entry", tokenLabel: "Access token", login: "Enter workspace", checking: "Checking", invalid: "Access token is not valid." }
    };
    let currentLang = localStorage.getItem("guardx_lang") || "zh";
    function applyLang(lang) {
      currentLang = lang;
      const pack = dict[lang] || dict.zh;
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.querySelectorAll("[data-i18n]").forEach((node) => node.textContent = pack[node.dataset.i18n] || node.textContent);
      document.querySelectorAll(".lang").forEach((button) => button.classList.toggle("active", button.dataset.lang === lang));
      localStorage.setItem("guardx_lang", lang);
    }
    document.querySelectorAll(".lang").forEach((button) => button.addEventListener("click", () => applyLang(button.dataset.lang)));
    applyLang(currentLang);

    const token = document.getElementById("token");
    const status = document.getElementById("status");
    const next = new URLSearchParams(location.search).get("next") || "/portal";
    async function login() {
      status.className = "status";
      status.textContent = (dict[currentLang] || dict.zh).checking;
      try {
        const response = await fetch("/v1/web_login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({token: token.value})
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        location.href = next;
      } catch (error) {
        status.className = "status error";
        status.textContent = (dict[currentLang] || dict.zh).invalid;
      }
    }
    document.getElementById("login").addEventListener("click", login);
    token.addEventListener("keydown", (event) => { if (event.key === "Enter") login(); });
  </script>
</body>
</html>
