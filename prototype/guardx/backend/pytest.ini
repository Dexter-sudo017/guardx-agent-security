[pytest]
testpaths = tests
python_files = test_*.py *_test.py
addopts = -m "not slow"
markers =
    smoke: fast route and integration smoke tests for regular refactor verification.
    contract: architectural boundary and API contract tests.
    eval: evaluation-suite endpoints and metadata.
    benchmark: benchmark-suite endpoints and filtering.
    slow: long-running tests excluded from the default suite.
