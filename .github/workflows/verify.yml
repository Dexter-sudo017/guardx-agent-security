name: GuardX verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/guardx/backend/requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend verification dependencies
        run: python -m pip install -r prototype/guardx/backend/requirements-ci.txt

      - name: Check frontend JavaScript
        run: |
          node --check reviewer_console/assets/runtime-config.js
          node --check reviewer_console/assets/guardx.js

      - name: Run GuardX contracts
        working-directory: prototype/guardx/backend
        env:
          DEEPSEEK_API_KEY: ""
          MOONSHOT_API_KEY: ""
          ZHIPU_API_KEY: ""
          DASHSCOPE_API_KEY: ""
        run: python -m pytest tests/test_contracts.py tests/test_live_rag.py -q

      - name: Verify deployable container
        run: docker build -f prototype/guardx/backend/Dockerfile -t guardx-reviewer:verify .
